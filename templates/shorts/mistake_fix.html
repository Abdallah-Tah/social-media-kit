<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; width: 1080px; height: 1920px; background: #f8fbff; color: #081b44; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    .frame { position: relative; width: 1080px; height: 1920px; padding: 90px 72px; background: linear-gradient(180deg, #f8fbff 0%, #f3f6fc 100%); overflow: hidden; }
    .top { display: flex; justify-content: space-between; color: #40527a; font-size: 30px; }
    .brand { font-weight: 800; }
    .brand-bw { color: #081b44; }
    .brand-a  { color: #0866ff; }
    h1 { margin: 110px 0 64px; font-size: 68px; line-height: 1.08; letter-spacing: 0; }
    .panel { border-radius: 10px; border: 3px solid #f3c7c7; background: #fff5f5; padding: 46px; }
    .tag { font-size: 34px; font-weight: 900; margin-bottom: 26px; }
    .tag-mistake { color: #d83a2f; }
    .tag-fix     { color: #0866ff; }
    .panel-text { color: #081b44; font-size: 46px; line-height: 1.22; }
    .fix { margin-top: 48px; border-radius: 10px; border: 3px solid #cfe0ff; background: #eef4ff; padding: 46px; }
    .takeaway { color: #40527a; font-size: 42px; line-height: 1.22; }
    .geo-tr { position: absolute; top: 0; right: 0; width: 220px; opacity: .4; }
    .geo-bl { position: absolute; bottom: 60px; left: 48px; width: 80px; opacity: .25; fill: #0866ff; }
    .wm { position: absolute; right: 54px; bottom: 52px; display: flex; align-items: center; gap: 12px; color: #7c8aa5; font-size: 26px; }
    .wm-img { width: 78px; height: 78px; object-fit: contain; }
    .wm-text { width: 78px; height: 78px; border: 3px solid #0866ff; color: #0866ff; display: grid; place-items: center; font-weight: 900; font-size: 20px; }
  </style>
</head>
<body>
  <div class="frame">
    <svg class="geo-tr" viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg">
      <path d="M260 0 H80 L260 180 Z" fill="#cfe0ff"/>
      <path d="M260 0 H160 L260 110 Z" fill="#0866ff" opacity=".7"/>
    </svg>
    <svg class="geo-bl" viewBox="0 0 90 64" xmlns="http://www.w3.org/2000/svg">
      <circle cx="6"  cy="6"  r="3.5"/><circle cx="22" cy="6"  r="3.5"/><circle cx="38" cy="6"  r="3.5"/><circle cx="54" cy="6"  r="3.5"/><circle cx="70" cy="6"  r="3.5"/><circle cx="86" cy="6"  r="3.5"/>
      <circle cx="6"  cy="22" r="3.5"/><circle cx="22" cy="22" r="3.5"/><circle cx="38" cy="22" r="3.5"/><circle cx="54" cy="22" r="3.5"/><circle cx="70" cy="22" r="3.5"/><circle cx="86" cy="22" r="3.5"/>
      <circle cx="6"  cy="38" r="3.5"/><circle cx="22" cy="38" r="3.5"/><circle cx="38" cy="38" r="3.5"/><circle cx="54" cy="38" r="3.5"/><circle cx="70" cy="38" r="3.5"/><circle cx="86" cy="38" r="3.5"/>
      <circle cx="6"  cy="54" r="3.5"/><circle cx="22" cy="54" r="3.5"/><circle cx="38" cy="54" r="3.5"/><circle cx="54" cy="54" r="3.5"/><circle cx="70" cy="54" r="3.5"/><circle cx="86" cy="54" r="3.5"/>
    </svg>
    <div class="top">
      <div class="brand"><span class="brand-bw">Build With </span><span class="brand-a">Abdallah</span></div>
      <div>{{progress}}</div>
    </div>
    <h1>{{title}}</h1>
    <section class="panel">
      <div class="tag tag-mistake">MISTAKE</div>
      <div class="panel-text">{{caption}}</div>
    </section>
    <section class="fix">
      <div class="tag tag-fix">FIX</div>
      <div class="takeaway">{{takeaway}}</div>
    </section>
    <div class="wm">{{watermark}}</div>
  </div>
</body>
</html>
